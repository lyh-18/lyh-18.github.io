- title: Science Communication & Outreach
  type: list
  contents:
    - Author of cross-disciplinary popular-science stories that connect rigorous ideas with everyday life. The flagship article, <a href="https://mp.weixin.qq.com/s/_dEUZbKgWQ5kPcf-LI8xjw" target="_blank" rel="noopener noreferrer"><em>Physical Laws Tell You That All Lovers Will Eventually Break Up</em></a>, accumulated more than 10 million views and appeared on Weibo’s trending list. <a href="/popular-science/">Selected stories →</a><br><span lang="zh-CN">持续创作连接严谨科学与日常生活的跨学科科普文章。代表作<a href="https://mp.weixin.qq.com/s/_dEUZbKgWQ5kPcf-LI8xjw" target="_blank" rel="noopener noreferrer">《物理定律告诉你，天下有情人终将分手！》</a>累计阅读量超过千万，并登上微博热搜。<a href="/popular-science/">浏览科普作品 →</a></span>
    - Former Director of the official WeChat editorial team at the University of Chinese Academy of Sciences, applying research-minded and data-informed methods to campus media. Contributed to the planning and production of six stories with more than 100,000 views each. <a href="https://zqb.cyol.com/html/2016-12/20/nw.D110000zgqnb_20161220_3-12.htm" target="_blank" rel="noopener noreferrer">China Youth Daily feature →</a><br><span lang="zh-CN">曾任中国科学院大学官方微信学生团队编辑部主任，以科研思维和数据分析方法探索校园新媒体；参与策划和创作的作品中，有 6 篇单篇阅读量超过 10 万。<a href="https://mp.weixin.qq.com/s/nRxenXkfEggALLPWLIIoew" target="_blank" rel="noopener noreferrer">阅读团队回顾 →</a></span>
    - Designed and contributed to interactive outreach projects that brought AI into campus culture, including a UCAS 40th-anniversary experience that used facial landmark detection to generate personalized graduation-cap portraits. <a href="https://mp.weixin.qq.com/s/pDVXX91yQtKtDgCMacPnTQ" target="_blank" rel="noopener noreferrer">View the project story →</a><br><span lang="zh-CN">尝试让人工智能走进校园文化与公共表达，曾为国科大四十周年校庆策划并参与人脸关键点检测互动项目，为用户生成国科大专属学位帽头像。<a href="https://mp.weixin.qq.com/s/pDVXX91yQtKtDgCMacPnTQ" target="_blank" rel="noopener noreferrer">查看项目介绍 →</a></span>
    - Co-developed <a href="https://thunderbolt215.github.io/ArtiMuse-project/" target="_blank" rel="noopener noreferrer">ArtiMuse</a> with the China Academy of Art, exploring how multimodal models can understand and explain aesthetics through interdisciplinary collaboration. The project is available as an <a href="https://artimuse.intern-ai.org.cn/" target="_blank" rel="noopener noreferrer">interactive online demo</a>. <a href="https://mp.weixin.qq.com/s/PBjQyKOCsv1gxY4cIn9t0w" target="_blank" rel="noopener noreferrer">In-depth feature →</a><br><span lang="zh-CN">与中国美术学院团队联合研发<a href="https://thunderbolt215.github.io/ArtiMuse-project/" target="_blank" rel="noopener noreferrer">“书生·妙析” ArtiMuse</a>，通过跨学科合作探索多模态模型如何理解并解释美学；项目提供<a href="https://artimuse.intern-ai.org.cn/" target="_blank" rel="noopener noreferrer">在线体验 Demo</a>。<a href="/journey/#journey-artimuse">了解项目背后的故事 →</a></span>

