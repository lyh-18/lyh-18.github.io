- title: Research Interests
  type: list
  contents:
    - Unified multimodal foundation models for text, image, video, and audio generation and understanding
    - Knowledge-driven and causality-aware modeling for scientifically grounded and logically consistent outputs
    - General low-level vision, including restoration, enhancement, style transfer, and dense prediction
    - Multimodal post-training, reward modeling, and human/expert preference alignment

